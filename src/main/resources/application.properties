spring.application.name=studyPlanner


# Lokale, per .gitignore ausgeschlossene Property-Datei mit echten Zugangsdaten (optional).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${POSTGRESQL_URL:jdbc:postgresql://localhost:5432/studyplannerdb}
spring.datasource.username=${POSTGRESQL_USERNAME:postgres}
spring.datasource.password=${POSTGRESQL_PASSWORD:postgres}

# Vorlaeufig: erst hibernate die Tabellenkoepfe initialisieren lassen und danach erst die data.sql einlesen:
spring.jpa.defer-datasource-initialization=true
# Volaeufig: Dantenbank bei jedem Start der Anwendung neu anlegen und beim Beenden loeschen:
spring.jpa.hibernate.ddl-auto=create-drop
# Vorlaeufig: auch entfernte Datenbank jedesmal neu initialisieren
spring.sql.init.mode=always

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
